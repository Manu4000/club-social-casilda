
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administración | Club Social</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;background:#f1f5f2;margin:0;color:#173b2b}
header{background:#12633e;color:white;padding:22px;text-align:center}
main{max-width:850px;margin:25px auto;padding:16px}
section{background:white;padding:20px;border-radius:12px;margin-bottom:18px;box-shadow:0 2px 8px #0001}
input,select,textarea,button{box-sizing:border-box;width:100%;padding:12px;margin:7px 0;border:1px solid #ccc;border-radius:7px;font-size:15px}
button{background:#12633e;color:white;border:0;font-weight:bold;cursor:pointer}
button.secondary{background:#68776e}
.item{border-bottom:1px solid #ddd;padding:12px 0}
.hidden{display:none}
h2{margin-top:0}
#mensaje{padding:10px;border-radius:7px}
</style>
</head>
<body>
<header>
<h1>⚽ Club Social Casilda</h1>
<p>Panel privado de administración</p>
</header>
<main>
<section id="login">
<h2>Ingresar</h2>
<input id="email" type="email" placeholder="Correo electrónico">
<input id="password" type="password" placeholder="Contraseña">
<button onclick="ingresar()">Iniciar sesión</button>
<p id="errorLogin"></p>
</section>

<div id="panel" class="hidden">
<section>
<h2>Administración</h2>
<p>Desde acá podés cargar y administrar la información del club.</p>
<button class="secondary" onclick="salir()">Cerrar sesión</button>
</section>

<section>
<h2>Publicar actividad o comunicado</h2>
<input id="titulo" placeholder="Título">
<textarea id="descripcion" placeholder="Descripción"></textarea>
<select id="categoria">
<option>Fútbol infantil</option>
<option>Torneos y encuentros</option>
<option>Comunicados generales</option>
</select>
<label>Fecha (opcional)</label>
<input id="fecha" type="date">
<input id="horario" placeholder="Horario (ej. 10:00 hs)">
<input id="lugar" placeholder="Lugar">
<button onclick="crearActividad()">Publicar</button>
<div id="actividades"></div>
</section>

<section>
<h2>Agregar club</h2>
<input id="nombreClub" placeholder="Nombre del club">
<input id="escudoClub" placeholder="URL del escudo (opcional)">
<button onclick="crearClub()">Agregar club</button>
<div id="clubes"></div>
</section>

<section>
<h2>Agregar cancha o lugar</h2>
<input id="nombreCancha" placeholder="Nombre de la cancha">
<input id="ubicacionCancha" placeholder="Ubicación">
<button onclick="crearCancha()">Agregar cancha</button>
<div id="canchas"></div>
</section>

<section>
<h2>Agregar partido</h2>
<label>Actividad o encuentro</label>
<select id="partidoActividad"></select>
<label>Categoría</label>
<input id="partidoCategoria" placeholder="Ej. 2015">
<label>Club local</label>
<select id="clubLocal"></select>
<label>Club visitante</label>
<select id="clubVisitante"></select>
<label>Fecha</label>
<input id="partidoFecha" type="date">
<label>Horario</label>
<input id="partidoHorario" placeholder="Ej. 10:30 hs">
<label>Cancha</label>
<select id="partidoCancha"></select>
<button onclick="crearPartido()">Guardar partido</button>
<div id="partidos"></div>
</section>
</div>
<p id="mensaje"></p>
</main>

<script>
const URL_SUPABASE = "https://eazpzkjomhojzwresvoa.supabase.co";
const CLAVE_PUBLICA = "sb_publishable_7LrSBH4iHJvnxsJLdZt_AA_-0hEOx-3";
const ADMIN_ID = "d3f17178-362b-4c29-b2ab-4ee5b5ada1f6";
const db = window.supabase.createClient(URL_SUPABASE, CLAVE_PUBLICA);

function mensaje(texto){
 document.getElementById("mensaje").textContent=texto;
}
async function ingresar(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const {data,error}=await db.auth.signInWithPassword({email,password});
 if(error){document.getElementById("errorLogin").textContent=error.message;return;}
 if(data.user.id!==ADMIN_ID){
  await db.auth.signOut();
  document.getElementById("errorLogin").textContent="No tenés autorización para administrar.";
  return;
 }
 mostrarPanel();
}
async function verificarSesion(){
 const {data}=await db.auth.getSession();
 if(data.session){
  if(data.session.user.id===ADMIN_ID) mostrarPanel();
  else await db.auth.signOut();
 }
}
function mostrarPanel(){
 document.getElementById("login").classList.add("hidden");
 document.getElementById("panel").classList.remove("hidden");
 cargarTodo();
}
async function salir(){
 await db.auth.signOut();
 location.reload();
}
async function crearActividad(){
 const fila={
  titulo:document.getElementById("titulo").value.trim(),
  descripcion:document.getElementById("descripcion").value.trim(),
  categoria:document.getElementById("categoria").value,
  fecha:document.getElementById("fecha").value||null,
  horario:document.getElementById("horario").value.trim(),
  lugar:document.getElementById("lugar").value.trim(),
  publicado:true
 };
 if(!fila.titulo){mensaje("Escribí un título.");return;}
 const {error}=await db.from("actividades").insert(fila);
 if(error){mensaje("Error: "+error.message);return;}
 ["titulo","descripcion","fecha","horario","lugar"].forEach(id=>document.getElementById(id).value="");
 mensaje("Actividad publicada correctamente.");
 cargarTodo();
}
async function crearClub(){
 const nombre=document.getElementById("nombreClub").value.trim();
 if(!nombre){mensaje("Escribí el nombre del club.");return;}
 const {error}=await db.from("clubes").insert({
  nombre,escudo_url:document.getElementById("escudoClub").value.trim()||null
 });
 if(error){mensaje("Error: "+error.message);return;}
 document.getElementById("nombreClub").value="";
 document.getElementById("escudoClub").value="";
 mensaje("Club agregado.");
 cargarTodo();
}
async function crearCancha(){
 const nombre=document.getElementById("nombreCancha").value.trim();
 if(!nombre){mensaje("Escribí el nombre de la cancha.");return;}
 const {error}=await db.from("canchas").insert({
  nombre,ubicacion:document.getElementById("ubicacionCancha").value.trim()
 });
 if(error){mensaje("Error: "+error.message);return;}
 document.getElementById("nombreCancha").value="";
 document.getElementById("ubicacionCancha").value="";
 mensaje("Cancha agregada.");
 cargarTodo();
}
async function crearPartido(){
 const fila={
  actividad_id:document.getElementById("partidoActividad").value||null,
  categoria:document.getElementById("partidoCategoria").value.trim(),
  club_local_id:document.getElementById("clubLocal").value||null,
  club_visitante_id:document.getElementById("clubVisitante").value||null,
  fecha:document.getElementById("partidoFecha").value||null,
  horario:document.getElementById("partidoHorario").value.trim(),
  cancha_id:document.getElementById("partidoCancha").value||null
 };
 if(!fila.club_local_id||!fila.club_visitante_id){mensaje("Seleccioná los dos clubes.");return;}
 if(fila.club_local_id===fila.club_visitante_id){mensaje("Elegí dos clubes diferentes.");return;}
 const {error}=await db.from("partidos").insert(fila);
 if(error){mensaje("Error: "+error.message);return;}
 mensaje("Partido guardado.");
 cargarTodo();
}
function agregarOpciones(id,filas,etiqueta){
 const select=document.getElementById(id);
 const anterior=select.value;
 select.innerHTML='<option value="">Seleccionar</option>';
 filas.forEach(f=>{
  const op=document.createElement("option");
  op.value=f.id;op.textContent=etiqueta(f);select.appendChild(op);
 });
 if(filas.some(f=>String(f.id)===anterior))select.value=anterior;
}
function mostrarLista(id,filas,etiqueta,tabla){
 const cont=document.getElementById(id);
 cont.innerHTML="";
 filas.forEach(f=>{
  const div=document.createElement("div");
  div.className="item";
  const nombre=document.createElement("span");
  nombre.textContent=etiqueta(f)+" ";
  const boton=document.createElement("button");
  boton.textContent="Eliminar";
  boton.className="secondary";
  boton.onclick=()=>eliminar(tabla,f.id);
  div.append(nombre,boton);
  cont.appendChild(div);
 });
}
async function eliminar(tabla,id){
 if(!confirm("¿Seguro que querés eliminar este elemento?"))return;
 const {error}=await db.from(tabla).delete().eq("id",id);
 if(error){mensaje("Error: "+error.message);return;}
 mensaje("Elemento eliminado.");
 cargarTodo();
}
async function cargarTodo(){
 const [a,c,k,p]=await Promise.all([
  db.from("actividades").select("*").order("id",{ascending:false}),
  db.from("clubes").select("*").order("nombre"),
  db.from("canchas").select("*").order("nombre"),
  db.from("partidos").select("*").order("fecha")
 ]);
 for(const r of [a,c,k,p]){
  if(r.error){mensaje("Error al cargar datos: "+r.error.message);return;}
 }
 mostrarLista("actividades",a.data,x=>x.titulo+" — "+x.categoria,"actividades");
 mostrarLista("clubes",c.data,x=>x.nombre,"clubes");
 mostrarLista("canchas",k.data,x=>x.nombre,"canchas");
 mostrarLista("partidos",p.data,x=>"Partido "+(x.categoria||"")+" — "+(x.fecha||"Sin fecha"),"partidos");
 agregarOpciones("partidoActividad",a.data,x=>x.titulo);
 agregarOpciones("clubLocal",c.data,x=>x.nombre);
 agregarOpciones("clubVisitante",c.data,x=>x.nombre);
 agregarOpciones("partidoCancha",k.data,x=>x.nombre);
}
verificarSesion();
</script>
</body>
</html>
